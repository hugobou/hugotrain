name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: ./gradlew --no-daemon assembleDebug

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HugoTrain.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HugoTrain-apk
          path: HugoTrain.apk

      # En cada cambio en main se publica el APK en la release "latest",
      # para descargarlo directamente desde el móvil.
      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HugoTrain.apk \
            --title "HugoTrain (última versión)" \
            --notes "Compilación automática #${{ github.run_number }} del commit ${{ github.sha }}." \
            --target ${{ github.sha }}
